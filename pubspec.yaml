name: wedding_qr_local_app
description: Local one-time wedding invitation QR scanner built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.1
  mobile_scanner: 5.2.3
  qr_flutter: ^4.1.0
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
dependency_overrides:
  mobile_scanner:
    path: packages/mobile_scanner
flutter:
  assets:
    - assets/1.png
  uses-material-design: true
